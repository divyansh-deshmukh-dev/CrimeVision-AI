<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrimeVision AI — Investigator Sign In</title>
  <meta name="csrf-token" content="{{ csrf_token }}" />

  <!-- Google Fonts: Inter & JetBrains Mono (Stitch Design System) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-canvas: #0c0e13;
      --bg-surface: #141720;
      --bg-surface-elevated: #1a1e2a;
      --bg-input: #0f121a;
      --border-subtle: #232834;
      --border-focus: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --cyan-primary: #38bdf8;
      --cyan-hover: #0284c7;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.4) 0%, transparent 50%);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 36px 32px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      text-decoration: none;
      margin-bottom: 16px;
    }

    .brand-glyph {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--cyan-primary);
    }

    .brand-accent {
      color: var(--cyan-primary);
      margin-left: 2px;
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 20px;
      line-height: 1.4;
      font-family: var(--font-sans);
    }

    .auth-alert--error {
      display: block;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }

    .auth-alert--success {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: var(--font-mono);
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      background: #121622;
    }

    .form-input::placeholder {
      color: #475569;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--cyan-primary);
      color: #0c0e13;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.01em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
    }

    .btn-submit:hover:not(:disabled) {
      background: #7dd3fc;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .demo-separator {
      display: flex;
      align-items: center;
      margin: 22px 0 16px;
      color: var(--text-faint);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: var(--font-mono);
    }

    .demo-separator span:first-child,
    .demo-separator span:last-child {
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .demo-separator span:nth-child(2) {
      padding: 0 10px;
    }

    .btn-demo-login {
      width: 100%;
      padding: 11px 16px;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: var(--cyan-primary);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-demo-login:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--cyan-primary);
    }

    .demo-caption {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-faint);
      margin-top: 8px;
      line-height: 1.4;
      font-family: var(--font-sans);
    }

    .demo-caption code {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--cyan-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="auth-brand">
        <span class="brand-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2" />
            <polyline points="2 17 12 22 22 17" />
            <polyline points="2 12 12 17 22 12" />
          </svg>
        </span>
        <span>CrimeVision <span class="brand-accent">AI</span></span>
      </a>
      <h1 class="auth-title">Investigator Sign In</h1>
      <p class="auth-subtitle">Authenticate to access forensic analysis workspaces</p>
    </div>

    <div id="auth-alert" class="auth-alert"></div>

    <form id="login-form">
      <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token }}" />

      <div class="form-group">
        <label for="username" class="form-label">Username or Email</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          autocomplete="username"
          placeholder="e.g. user-12 or investigator@agency.gov"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          autocomplete="current-password"
          placeholder="••••••••••••"
          required
        />
      </div>

      <button type="submit" id="btn-submit" class="btn-submit">
        <span id="btn-text">Sign In</span>
      </button>
    </form>

    <div class="demo-separator">
      <span></span>
      <span>Evaluation & Mentorship</span>
      <span></span>
    </div>

    <button type="button" id="btn-demo-login" class="btn-demo-login">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <span id="btn-demo-text">Demo Login</span>
    </button>
    <p class="demo-caption">
      Prefills evaluator credentials (<code>user-12</code>). Review and click Sign In to authenticate.
    </p>

    <div class="auth-footer">
      <p>New examiner? <a href="/signup">Create an Account</a></p>
      <p style="margin-top: 10px;"><a href="/" style="color: var(--text-faint);">← Return to Platform Overview</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('auth-alert');
    const submitBtn = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = 'auth-alert ' + (isSuccess ? 'auth-alert--success' : 'auth-alert--error');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'auth-alert';
      submitBtn.disabled = true;
      btnText.textContent = 'Verifying credentials...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const csrfToken = document.getElementById('csrf_token').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          showAlert('Authentication verified. Loading workspace...', true);
          const params = new URLSearchParams(window.location.search);
          const nextUrl = params.get('next') || '/workspace';
          setTimeout(() => {
            window.location.href = nextUrl;
          }, 400);
        } else {
          showAlert(data.error || 'Authentication failed. Please verify your credentials.');
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      } catch (err) {
        showAlert('Network or connection error. Please try again.');
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    });

    const demoBtn = document.getElementById('btn-demo-login');
    if (demoBtn) {
      demoBtn.addEventListener('click', () => {
        alertBox.className = 'auth-alert';
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        usernameInput.value = 'user-12';
        passwordInput.value = 'user1234';
        showAlert('Evaluation credentials populated (user-12). Click Sign In to authenticate.', true);
        usernameInput.focus();
      });
    }
  </script>
</body>
</html>
